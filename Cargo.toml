[package]
name = "sse-discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6.2"
tokio = { version = "1.52.3", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
dotenvy = "0.15.7"
config = "0.15.23"
secrecy = "0.10.3"
anyhow = "1.0.102"
rand = "0.10.1"
lettre = { version = "0.11.22", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
reqwest = { version = "0.12.24", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
wiremock = "0.6.5"
